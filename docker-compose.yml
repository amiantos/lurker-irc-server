# irc.lurker.chat — one Ergo, nothing else.
#
# Bring-up order: scripts/render.sh (writes data/ircd.yaml from the template and
# ergo.env), certificates in data/tls/, then `docker compose up -d`.
services:
  ergo:
    # Built from ./Dockerfile: stock Ergo v2.19.1 plus the DNSBL plugin. The
    # Ergo tag is pinned there; `stable` would move under you and an upgrade
    # disconnects everyone, so upgrades are a deliberate scripts/update.sh.
    build: .
    image: lurker-irc-server/ergo:local
    container_name: ergo
    restart: unless-stopped
    # Host networking, not published ports. A published port on a bridge network
    # reaches the container through Docker's userland proxy for IPv6 clients (the
    # bridge has no IPv6), and the proxy re-sends from the bridge gateway, so Ergo
    # saw every IPv6 user as 172.18.0.1: one shared cloak, one shared per-IP cap,
    # one DNSBL check that can never match, and a host ban that hits all of them.
    # With the host's network namespace Ergo binds :6697 and :443 itself and
    # sees the real peer, v4 and v6. The DO firewall is the only firewall either way.
    network_mode: host
    volumes:
      # /ircd is the image's working dir: ircd.yaml, ircd.motd (both written by
      # render.sh), ircd.db and tls/ live here. The MOTD is copied, not
      # bind-mounted: git replaces files by rename, and a single-file bind mount
      # keeps pointing at the old inode, so rehash would reload stale text.
      - ./data:/ircd
    # Bypass the image's entrypoint: it would GENERATE a default config (public
    # plaintext :6667) if ours were missing, and mint self-signed certs. With
    # this, a missing data/ircd.yaml fails the container instead.
    entrypoint: ["/ircd-bin/ergo"]
    command: ["run", "--conf", "/ircd/ircd.yaml"]
    healthcheck:
      # The loopback plaintext listener exists for exactly this.
      test: ["CMD", "nc", "-z", "127.0.0.1", "6667"]
      interval: 30s
      timeout: 5s
      retries: 3
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
